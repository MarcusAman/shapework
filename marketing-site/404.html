<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — shapework.</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f2ec;
    --paper-deep: #ebe6dc;
    --ink: #14140f;
    --ink-soft: #4a4a44;
    --ink-mute: #8a8a82;
    --rule: #d6d0c2;
    --green: #1f3a2e;
    --green-light: #8fb09f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }

  nav {
    padding: 28px 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--rule);
  }
  .nav-wordmark {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 24px; font-weight: 500; letter-spacing: -0.03em;
    color: var(--ink); text-decoration: none;
  }
  .nav-wordmark .dot { color: var(--green); }
  .nav-link {
    color: var(--ink-soft); text-decoration: none;
    font-size: 14px; transition: color 0.2s;
  }
  .nav-link:hover { color: var(--ink); }

  .error-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 56px;
  }
  .error-code {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(72px, 16vw, 180px);
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--green);
    margin-bottom: 24px;
  }
  .error-main h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }
  .error-main p {
    font-size: 18px;
    color: var(--ink-soft);
    max-width: 480px;
    margin: 0 auto 40px;
    line-height: 1.6;
  }
  .error-links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .error-button {
    display: inline-block;
    padding: 16px 32px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    border-radius: 100px;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.25s ease;
  }
  .error-button:hover { background: var(--green); transform: translateY(-2px); }
  .error-button.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .error-button.secondary:hover {
    background: var(--ink);
    color: var(--paper);
    transform: translateY(-2px);
  }

  footer {
    border-top: 1px solid var(--rule);
    padding: 32px 56px;
    background: var(--paper-deep);
    text-align: center;
    font-size: 13px;
    color: var(--ink-mute);
  }

  @media (max-width: 767px) {
    nav { padding: 18px 24px; }
    .nav-wordmark { font-size: 20px; }
    .error-main { padding: 60px 24px; }
    .error-main p { font-size: 16px; }
    .error-links { flex-direction: column; width: 100%; max-width: 280px; }
    .error-button { width: 100%; }
    footer { padding: 24px; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-wordmark">shapework<span class="dot">.</span></a>
  <a href="/" class="nav-link">Back to home</a>
</nav>

<main class="error-main">
  <div class="error-code">404</div>
  <h1>This page took a wrong turn.</h1>
  <p>The page you're looking for doesn't exist, or it moved. Let's get you back to something useful.</p>
  <div class="error-links">
    <a href="/" class="error-button">Back to home</a>
    <a href="/discovery" class="error-button secondary">Workflow Discovery</a>
  </div>
</main>

<footer>
  © 2026 shapework. · Modern Workflow Design
</footer>

</body>
</html>
