<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" width="900" height="480">

  <!-- Background -->
  <rect width="900" height="480" fill="#F5F2EC" />

  <!-- Section label -->
  <text x="450" y="36" text-anchor="middle" font-size="11" fill="#8A9186" letter-spacing="3" font-style="italic" font-family="Georgia, serif">Operational Intelligence</text>
  <line x1="160" y1="42" x2="330" y2="42" stroke="#8A9186" stroke-width="0.5" opacity="0.5"/>
  <line x1="570" y1="42" x2="740" y2="42" stroke="#8A9186" stroke-width="0.5" opacity="0.5"/>

  <!-- Divider line center -->
  <line x1="450" y1="65" x2="450" y2="415" stroke="#DDD9D1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- LEFT LABEL: Before -->
  <text x="225" y="80" text-anchor="middle" font-size="13" fill="#1C1F1A" font-family="Georgia, serif" font-style="italic">before.</text>
  <text x="225" y="98" text-anchor="middle" font-size="10" fill="#8A9186" font-family="Georgia, serif" letter-spacing="1">no system design</text>

  <!-- RIGHT LABEL: After -->
  <text x="675" y="80" text-anchor="middle" font-size="13" fill="#4A6741" font-family="Georgia, serif" font-style="italic">after.</text>
  <text x="675" y="98" text-anchor="middle" font-size="10" fill="#8A9186" font-family="Georgia, serif" letter-spacing="1">designed workflow</text>

  <!-- ===== BEFORE: tangled chaos ===== -->
  <!-- chaotic connector lines -->
  <line x1="130" y1="160" x2="310" y2="280" stroke="#1C1F1A" stroke-width="1.2" opacity="0.35"/>
  <line x1="180" y1="320" x2="290" y2="175" stroke="#1C1F1A" stroke-width="1.2" opacity="0.35"/>
  <line x1="120" y1="240" x2="320" y2="355" stroke="#1C1F1A" stroke-width="1.2" opacity="0.35"/>
  <line x1="200" y1="155" x2="100" y2="360" stroke="#1C1F1A" stroke-width="1.2" opacity="0.35"/>
  <line x1="310" y1="180" x2="135" y2="310" stroke="#1C1F1A" stroke-width="1.2" opacity="0.35"/>
  <line x1="260" y1="350" x2="155" y2="195" stroke="#1C1F1A" stroke-width="1.2" opacity="0.35"/>
  <line x1="100" y1="290" x2="305" y2="230" stroke="#1C1F1A" stroke-width="1.2" opacity="0.35"/>
  <line x1="230" y1="165" x2="320" y2="330" stroke="#1C1F1A" stroke-width="1.2" opacity="0.35"/>
  <!-- nodes -->
  <circle cx="130" cy="160" r="10" fill="#1C1F1A"/>
  <circle cx="310" cy="180" r="10" fill="#1C1F1A"/>
  <circle cx="100" cy="240" r="10" fill="#1C1F1A"/>
  <circle cx="320" cy="280" r="10" fill="#1C1F1A"/>
  <circle cx="180" cy="320" r="10" fill="#1C1F1A"/>
  <circle cx="260" cy="350" r="10" fill="#1C1F1A"/>
  <circle cx="200" cy="155" r="10" fill="#1C1F1A"/>
  <circle cx="100" cy="360" r="10" fill="#1C1F1A"/>

  <!-- friction label -->
  <rect x="138" y="388" width="174" height="24" rx="3" fill="#B85C38" opacity="0.12"/>
  <text x="225" y="404" text-anchor="middle" font-size="11" fill="#B85C38" font-family="Georgia, serif" font-style="italic">friction everywhere</text>

  <!-- ===== AFTER: clean designed flow ===== -->
  <!-- defs for arrow -->
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#4A6741"/>
    </marker>
  </defs>

  <!-- clean horizontal flow with arrows -->
  <line x1="510" y1="255" x2="566" y2="255" stroke="#4A6741" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="606" y1="255" x2="662" y2="255" stroke="#4A6741" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="702" y1="255" x2="758" y2="255" stroke="#4A6741" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="798" y1="255" x2="840" y2="255" stroke="#4A6741" stroke-width="2" opacity="0.3"/>

  <!-- step nodes -->
  <circle cx="490" cy="255" r="22" fill="#4A6741"/>
  <text x="490" y="260" text-anchor="middle" font-size="10" fill="white" font-family="Georgia, serif">1</text>

  <circle cx="586" cy="255" r="22" fill="#4A6741"/>
  <text x="586" y="260" text-anchor="middle" font-size="10" fill="white" font-family="Georgia, serif">2</text>

  <circle cx="682" cy="255" r="22" fill="#4A6741"/>
  <text x="682" y="260" text-anchor="middle" font-size="10" fill="white" font-family="Georgia, serif">3</text>

  <circle cx="778" cy="255" r="22" fill="#4A6741"/>
  <text x="778" y="260" text-anchor="middle" font-size="10" fill="white" font-family="Georgia, serif">4</text>

  <!-- step labels below -->
  <text x="490" y="295" text-anchor="middle" font-size="10" fill="#8A9186" font-family="Georgia, serif" font-style="italic">intake</text>
  <text x="586" y="295" text-anchor="middle" font-size="10" fill="#8A9186" font-family="Georgia, serif" font-style="italic">process</text>
  <text x="682" y="295" text-anchor="middle" font-size="10" fill="#8A9186" font-family="Georgia, serif" font-style="italic">review</text>
  <text x="778" y="295" text-anchor="middle" font-size="10" fill="#8A9186" font-family="Georgia, serif" font-style="italic">deliver</text>

  <!-- clean label -->
  <rect x="552" y="388" width="196" height="24" rx="3" fill="#4A6741" opacity="0.12"/>
  <text x="650" y="404" text-anchor="middle" font-size="11" fill="#4A6741" font-family="Georgia, serif" font-style="italic">every step has an owner</text>

  <!-- bottom brand -->
  <text x="450" y="452" text-anchor="middle" font-size="10" fill="#8A9186" letter-spacing="2" font-style="italic" font-family="Georgia, serif">shapework.</text>

</svg>
